name: IndexNow Submit

# 当 main 分支有 push 时自动提交 IndexNow
on:
  push:
    branches:
      - main
  # 也支持手动触发
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract sitemap URLs
        id: extract
        run: |
          # 从 sitemap.xml 提取所有 URL
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "url_list=$URLS" >> $GITHUB_OUTPUT
          echo "Found $(echo $URLS | jq length) URLs"

      - name: Submit to IndexNow (bulk)
        run: |
          # IndexNow 批量提交
          URLS='${{ steps.extract.outputs.url_list }}'
          LENGTH=$(echo "$URLS" | jq length)

          # Split into batches of 100 if needed (IndexNow limit)
          BATCH_SIZE=100
          for ((i=0; i<LENGTH; i+=BATCH_SIZE)); do
            BATCH=$(echo "$URLS" | jq -c ".[$i:$((i+BATCH_SIZE))]")
            PAYLOAD=$(jq -n \
              --arg host "yanshu-legend.github.io" \
              --arg key "39b2f4e5c9d847d6a0138e2f5c0d1b7a" \
              --arg keylocation "https://yanshu-legend.github.io/legendcapital-geo/39b2f4e5c9d847d6a0138e2f5c0d1b7a.txt" \
              --argjson urls "$BATCH" \
              '{host: $host, key: $key, keyLocation: $keylocation, urlList: $urls}')

            echo "Submitting batch $((i/BATCH_SIZE + 1))..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$PAYLOAD")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            echo "Response: HTTP $HTTP_CODE"

            # 403 = 密钥验证失败（GitHub Pages 项目站必须显式指定 keyLocation，否则静默失败）
            if [ "$HTTP_CODE" = "403" ]; then
              echo "::error::IndexNow 403: key verification failed. keyLocation is required for GitHub Pages project sites."
              exit 1
            fi
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
              echo "::error::IndexNow unexpected HTTP $HTTP_CODE"
              exit 1
            fi
          done

      - name: Notify completion
        run: |
          echo "::notice::IndexNow submission completed for ${{ steps.extract.outputs.url_count }} URLs"
